[mgr]
ratio         = [ 1, 4, 3 ]
sort_by        = "mtime"
sort_sensitive = true
sort_reverse   = true
sort_dir_first = false
sort_translit  = false
linemode       = "none"
show_hidden    = true
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll", "drag" ]


[preview]
wrap            = "yes"
tab_size        = 2
max_width       = 600
max_height      = 900
cache_dir       = "$HOME/.cache/yazi"
image_delay     = 30
image_filter    = "triangle"
image_quality   = 75
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]


[opener]
nvim = [
	{ run = "nvim %s",    block = true, desc = "Neovim", for = "unix" },
	{ run = "nvim %s",    block = true, desc = "Neovim", for = "windows" },
]
open = [
    { run = 'start "" %s1',    desc = "Open", for = "windows", orphan = true },
]
extract = [
    { run = 'ouch d -y %*', desc = "Extract here with ouch", for = "windows" },
]
play = [
	{ run = 'mpv "%1"', orphan = true, desc = "MPV", for = "windows" },
]
trash = [
	{ run = "ya pub trash-restore --list %S", desc = "Restore selected files" },
	{ run = "ya pub trash-empty --list %S",   desc = "Empty trash bin" },
]

[open]
rules = [
	{ url = "*/", use = [ "open" ] },

	{ mime = "text/*",  use = [ "nvim", "open" ] },
	{ mime = "image/*", use = [ "open" ] },
	{ mime = "video/*", use = [ "play" ] },
	{ mime = "audio/*", use = [ "play" ] },
	{ mime = "inode/x-empty", use = [ "nvim", "open" ] },

	{ mime = "trash/**", use = [ "open", "trash" ] },

	{ mime = "application/json", use = [ "nvim", "open" ] },
	{ mime = "*/javascript",     use = [ "nvim", "open" ] },

	{ mime = "application/zip",           use = [ "open", "extract" ] },
	{ mime = "application/gzip",          use = [ "open", "extract" ] },
	{ mime = "application/tar",           use = [ "open", "extract" ] },
	{ mime = "application/bzip",          use = [ "open", "extract" ] },
	{ mime = "application/bzip2",         use = [ "open", "extract" ] },
	{ mime = "application/7z-compressed", use = [ "open", "extract" ] },
	{ mime = "application/rar",           use = [ "open", "extract" ] },
    { mime = "application/xz",            use = [ "open", "extract" ] },

    { url = "*.docx", use = [ "open" ] },
    { url = "*.doc",  use = [ "open" ] },
    { url = "*.xlsx", use = [ "open" ] },
    { url = "*.xls",  use = [ "open" ] },
    { url = "*.pptx", use = [ "open" ] },
    { url = "*.ppt",  use = [ "open" ] },
    { url = "*.pdf",  use = [ "open" ] },
    { url = "*.caj",  use = [ "open" ] },
    { url = "*.opju", use = [ "open" ] },
    { url = "*.rmvb", use = [ "play" ] },
    { url = "*.hm",   use = [ "open" ] },
    { url = "*.cae",  use = [ "open" ] },
    { url = "*.exe",  use = [ "open" ] },

	# Fallback
	{ url = "*", use = [ "nvim", "open" ] },
]


[tasks]
file_workers     = 3
plugin_workers   = 5
fetch_workers    = 5
preload_workers  = 2
process_workers  = 5
bizarre_retry    = 3
image_alloc      = 536870912  # 512MB
image_bound      = [ 10000, 10000 ]
suppress_preload = false


[plugin]
prepend_fetchers = [
  # plugin:mine-ext.yazi
  { url = "local://*", run = "mime-ext.local", prio = "high", group = "mime" },
  { url = "remote://*", run = "mime-ext.remote", prio = "high", group = "mime" },
  { url = "trash://*",  run = "mime.trash",  prio = "high", group = "mime" },
  # plugin:git.yazi
  { url = "*",  run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
]

preloaders = [
	# Image
	{ mime = "image/{avif,hei?,jxl}", run = "magick" },
	{ mime = "image/svg+xml", run = "svg" },
	{ mime = "image/*", run = "image" },
	# Video
	{ mime = "video/*", run = "video" },
	# PDF
	{ mime = "application/pdf", run = "pdf" },
	# Font
	{ mime = "font/*", run = "font" },
	{ mime = "application/ms-opentype", run = "font" },
	# Trash
	{ mime = "trash/**", run = "trash" },
]

previewers = [
	{ url = "*/", run = "folder" },
	# Code
	{ mime = "text/*", run = "code" },
	{ mime = "application/{mbox,javascript,wine-extension-ini}", run = "code" },
	# JSON
	{ mime = "application/{json,ndjson}", run = "json" },
	# Image
	{ mime = "image/{avif,hei?,jxl}", run = "magick" },
	{ mime = "image/svg+xml", run = "svg" },
	{ mime = "image/*", run = "image" },
	# Video
	{ mime = "video/*", run = "video" },
	# PDF
	{ mime = "application/pdf", run = "pdf" },
	# Font
	{ mime = "font/*", run = "font" },
	{ mime = "application/ms-opentype", run = "font" },
	# Empty file
	{ mime = "inode/empty", run = "empty" },
	# Trash
	{ mime = "trash/**", run = "trash" },
	# Error
	{ mime = "null/*", run = "null" },
	# Fallback
	{ url = "*", run = "file" },
]

[input]
cursor_blink = false

# cd
cd_title  = "Change directory:"
cd_origin = "top-center"
cd_offset = [ 0, 2, 50, 3 ]

# create
create_title  = [ "Create:", "Create (dir):" ]
create_origin = "top-center"
create_offset = [ 0, 2, 50, 3 ]

# rename
rename_title  = "Rename:"
rename_origin = "hovered"
rename_offset = [ 0, 1, 50, 3 ]

# filter
filter_title  = "Filter:"
filter_origin = "top-center"
filter_offset = [ 0, 2, 50, 3 ]

# find
find_title  = [ "Find next:", "Find previous:" ]
find_origin = "top-center"
find_offset = [ 0, 2, 50, 3 ]

# search
search_title  = "Search via {n}:"
search_origin = "top-center"
search_offset = [ 0, 2, 50, 3 ]

# shell
shell_title  = [ "Shell:", "Shell (block):" ]
shell_origin = "top-center"
shell_offset = [ 0, 2, 50, 3 ]

[confirm]
# trash
trash_title 	= "Trash {n} selected file{s}?"
trash_origin	= "center"
trash_offset	= [ 0, 0, 70, 20 ]

# delete
delete_title 	= "Permanently delete {n} selected file{s}?"
delete_origin	= "center"
delete_offset	= [ 0, 0, 70, 20 ]

# overwrite
overwrite_title  = "Overwrite file?"
overwrite_body   = "Will overwrite the following file:"
overwrite_origin = "center"
overwrite_offset = [ 0, 0, 50, 15 ]

# quit
quit_title  = "Quit?"
quit_body   = "There are unfinished tasks, quit anyway?\n(Open task manager with default key 'w')"
quit_origin = "center"
quit_offset = [ 0, 0, 50, 15 ]

[pick]
open_title  = "Open with:"
open_origin = "hovered"
open_offset = [ 0, 1, 50, 7 ]

[which]
sort_by      	 = "none"
sort_sensitive = false
sort_reverse 	 = false
sort_translit  = false

