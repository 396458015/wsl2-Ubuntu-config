[mgr]

keymap = [
	{ on = "<Esc>", run = "quit",               desc = "Exit visual mode, clear selected, or cancel search" },
	{ on = "q",     run = "escape",             desc = "Exit the process" },
	# { on = "Q",     run = "quit --no-cwd-file", desc = "Exit the process without writing cwd-file" },
	{ on = "<C-q>", run = "close",              desc = "Close the current tab, or quit if it is last tab" },
	{ on = "<C-z>", run = "suspend",            desc = "Suspend the process" },

	# Navigation
	{ on = "k", run = "arrow -1", desc = "Move cursor up" },
	{ on = "j", run = "arrow 1",  desc = "Move cursor down" },

	{ on = "K", run = "arrow -5", desc = "Move cursor up 5 lines" },
	{ on = "J", run = "arrow 5",  desc = "Move cursor down 5 lines" },

	{ on = "<C-PageUp>",   run = "arrow -50%",  desc = "Move cursor up half page" },
	{ on = "<C-PageDown>", run = "arrow 50%",   desc = "Move cursor down half page" },
	{ on = "<PageUp>",     run = "arrow -100%", desc = "Move cursor up one page" },
	{ on = "<PageDown>",   run = "arrow 100%",  desc = "Move cursor down one page" },

	{ on = "h", run = "leave", desc = "Go back to the parent directory" },
	{ on = "l", run = "enter", desc = "Enter the child directory" },

	{ on = "H", run = "back",    desc = "Go back to the previous directory" },
	{ on = "L", run = "forward", desc = "Go forward to the next directory" },

	{ on = "<C-b>", run = "seek -5", desc = "seek up 5 units in the preview" },
	{ on = "<C-f>", run = "seek 5",  desc = "seek down 5 units in the preview" },

	{ on = "<Up>",    run = "arrow -1", desc = "Move cursor up" },
	{ on = "<Down>",  run = "arrow 1",  desc = "Move cursor down" },
	{ on = "<Left>",  run = "leave",    desc = "Go back to the parent directory" },
	{ on = "<Right>", run = "enter",    desc = "Enter the child directory" },

	{ on = [ "g", "g" ], run = "arrow top", desc = "Move cursor to the top" },
	{ on = "G",          run = "arrow bot", desc = "Move cursor to the bottom" },

	# Selection
    { on = "<Space>", run = [ "toggle", "arrow 1" ], desc = "Toggle the current selection state" },
	{ on = "v",       run = "visual_mode",                        desc = "Enter visual mode (selection mode)" },
	{ on = "V",       run = "visual_mode --unset",                desc = "Enter visual mode (unset mode)" },
	{ on = "<C-a>",   run = "toggle_all --state=on",            desc = "Select all files" },
	# { on = "<C-r>",   run = "select_all --state=none",            desc = "Inverse selection of all files" },
    { on = "<C-r>", run = "refresh" },

	# Operation
	{ on = "o",         run = "open",                        desc = "Open the selected files" },
	{ on = "O",         run = "open --interactive",          desc = "Open the selected files interactively" },
	{ on = "<Enter>",   run = "open",                        desc = "Open the selected files" },
	{ on = "y",         run = "yank",                        desc = "Yank selected files (copy)" },
    { on = "Y",         run = "unyank",                      desc = "Cancel the yank status" },
	{ on = "d",         run = "yank --cut",                  desc = "Yank selected files (cut)" },
    { on = "D",         run = "unyank",                      desc = "Cancel the yank status" },
	{ on = "p",         run = "paste",                       desc = "Paste the files" },
	{ on = "P",         run = "paste --force",               desc = "Paste the files (overwrite if the destination exists)" },
	{ on = "-",         run = "link",                        desc = "Symlink the absolute path of files" },
	{ on = "_",         run = "link --relative",             desc = "Symlink the relative path of files" },
	{ on = "x",         run = "remove",                      desc = "Trash selected files" },
	{ on = "X",         run = "remove --permanently",        desc = "Permanently delete selected files" },
	{ on = "a",         run = "create",                      desc = "Create a file or directory (ends with / for directories)" },
	{ on = "A",         run = "create --dir",                desc = "Create a directory" },
	{ on = "r",         run = "rename --cursor=before_ext",  desc = "Rename a file or directory" },
	{ on = ";",         run = "shell --interactive",         desc = "Run a shell command" },
	{ on = ":",         run = "shell --block --interactive", desc = "Run a shell command (block until finishes)" },
	{ on = ".",         run = "hidden toggle",               desc = "Toggle the visibility of hidden files" },
	{ on = "s",         run = "search --via=fd",             desc = "Search files by name via fd" },
	{ on = "S",         run = "search --via=rg",             desc = "Search files by content via ripgrep" },
    # { on = "<C-s>",     run = "escape --search",             desc = "Cancel the ongoing search" },
	{ on = "z",         run = "plugin fzf",                  desc = "Jump to a directory, or reveal a file using fzf" },
	{ on = "Z",         run = "plugin zoxide",               desc = "Jump to a directory using zoxide" },

	# Linemode
	{ on = [ "m", "s" ], run = "linemode size",        desc = "Set linemode to size" },
	{ on = [ "m", "p" ], run = "linemode perm",        desc = "Set linemode to permissions" },
	{ on = [ "m", "t" ], run = "linemode mtime",       desc = "Set linemode to mtime" },
	{ on = [ "m", "n" ], run = "linemode none",        desc = "Set linemode to none" },
	{ on = [ "m", "c" ], run = "linemode btime",       desc = "Set linemode to btime" },
	{ on = [ "m", "o" ], run = "linemode owner",       desc = "Set linemode to owner" },

	# Copy
	{ on = [ "c", "c" ], run = "copy path",             desc = "Copy the absolute path" },
	{ on = [ "c", "d" ], run = "copy dirname",          desc = "Copy the path of the parent directory" },
	{ on = [ "c", "f" ], run = "copy filename",         desc = "Copy the name of the file" },
	{ on = [ "c", "n" ], run = "copy name_without_ext", desc = "Copy the name of the file without the extension" },

	# Filter
	{ on = "f", run = "filter --smart", desc = "Filter the files" },

	# Find
	{ on = "/", run = "find --smart",            desc = "Find next file" },
	{ on = "?", run = "find --previous --smart", desc = "Find previous file" },
	{ on = "n", run = "find_arrow",              desc = "Go to next found file" },
	{ on = "N", run = "find_arrow --previous",   desc = "Go to previous found file" },

	# Sorting
    { on = [ ",", "t" ], run = "sort mtime --reverse=no",        desc = "Sort by modified time" },
    { on = [ ",", "T" ], run = "sort mtime --reverse",           desc = "Sort by modified time (reverse)" },
    { on = [ ",", "c" ], run = "sort btime --reverse=no",        desc = "Sort by created time" },
    { on = [ ",", "C" ], run = "sort btime  --reverse",          desc = "Sort by created time (reverse)" },
    { on = [ ",", "e" ], run = "sort extension --reverse=no",    desc = "Sort by extension" },
    { on = [ ",", "E" ], run = "sort extension --reverse",       desc = "Sort by extension (reverse)" },
    { on = [ ",", "a" ], run = "sort alphabetical --reverse=no", desc = "Sort alphabetically" },
    { on = [ ",", "A" ], run = "sort alphabetical --reverse",    desc = "Sort alphabetically (reverse)" },
    { on = [ ",", "n" ], run = "sort natural --reverse=no",      desc = "Sort naturally" },
    { on = [ ",", "N" ], run = "sort natural --reverse",         desc = "Sort naturally (reverse)" },
    { on = [ ",", "s" ], run = "sort size --reverse=no",         desc = "Sort by size" },
    { on = [ ",", "S" ], run = "sort size --reverse",            desc = "Sort by size (reverse)" },

	# Tabs
	{ on = "t", run = "tab_create --current", desc = "Create a new tab using the current path" },

	{ on = "1", run = "tab_switch 0", desc = "Switch to the first tab" },
	{ on = "2", run = "tab_switch 1", desc = "Switch to the second tab" },
	{ on = "3", run = "tab_switch 2", desc = "Switch to the third tab" },
	{ on = "4", run = "tab_switch 3", desc = "Switch to the fourth tab" },
	{ on = "5", run = "tab_switch 4", desc = "Switch to the fifth tab" },
	{ on = "6", run = "tab_switch 5", desc = "Switch to the sixth tab" },
	{ on = "7", run = "tab_switch 6", desc = "Switch to the seventh tab" },
	{ on = "8", run = "tab_switch 7", desc = "Switch to the eighth tab" },
	{ on = "9", run = "tab_switch 8", desc = "Switch to the ninth tab" },

	{ on = "[", run = "tab_switch -1 --relative", desc = "Switch to the previous tab" },
	{ on = "]", run = "tab_switch 1 --relative",  desc = "Switch to the next tab" },

	{ on = "{", run = "tab_swap -1", desc = "Swap the current tab with the previous tab" },
	{ on = "}", run = "tab_swap 1",  desc = "Swap the current tab with the next tab" },

	# Tasks
	{ on = "w", run = "tasks:show", desc = "Show the tasks manager" },

	# Goto
	{ on = [ "g", "h" ],       run = "cd ~",             desc = "home dir" },
	{ on = [ "g", "c" ],       run = "cd ~/.config",     desc = "config dir" },
	# { on = [ "g", "d" ],       run = "cd ~/Downloads",   desc = "Go to the downloads directory" },
	{ on = [ "g", "t" ],       run = "cd /tmp",          desc = "temporary dir" },
    { on = [ "g", "T" ],       run = "plugin trash",     desc = "Go to trash bin" },
	{ on = [ "g", "<Space>" ], run = "cd --interactive", desc = "dir interactively" },
	# { on = [ "g", "d" ], run = "cd 'C:/Users/ThinkPad/Desktop'", desc = "Desktop" },
	# { on = [ "g", "D" ], run = "cd 'D:/Dotfiles'", desc = "Dotfiles" },
	# { on = [ "g", "p" ], run = "cd 'C:/Users/ThinkPad/Documents/PowerShell'", desc = "powershell config" },
	# { on = [ "g", "a" ], run = "cd 'C:/Users/ThinkPad/AppData/Roaming/alacritty'", desc = "alacritty config" },
	# { on = [ "g", "w" ], run = "cd 'C:/Users/ThinkPad/.config/wezterm'", desc = "wezterm config" },
	# { on = [ "g", "W" ], run = "cd 'D:/Dotfiles/windows-terminal/settings'", desc = "Wterminal config" },
	# { on = [ "g", "v" ], run = "cd 'C:/Users/ThinkPad/AppData/Local/nvim'", desc = "neovim config" },
	# { on = [ "g", "V" ], run = "cd 'C:/Users/ThinkPad/AppData/Roaming/Code/User'", desc = "Vscode config" },
	# { on = [ "g", "y" ], run = "cd 'C:/Users/ThinkPad/AppData/Roaming/yazi/config'", desc = "yazi config" },
	# { on = [ "g", "l" ], run = "cd 'C:/Users/ThinkPad/AppData/Roaming/lazygit'", desc = "lazygit config" },
	# { on = [ "g", "s" ], run = "cd 'C:/Users/ThinkPad/AppData/Roaming/Microsoft/Windows/Start Menu/Programs'", desc = "Start Menu (Win10)" },
	# { on = [ "g", "T" ], run = "cd 'C:/Users/ThinkPad/AppData/Roaming/typst/packages/local'", desc = "typst templates" },

	# { on = [ "g", "L" ], run = "cd '//wsl.localhost/Ubuntu/home/thinkpad/latex/latex_note'", desc = "Latex notes" },

	# { on = [ "g", "t" ], run = "cd 'D:/Program Files/TotalCMD'", desc = "Total Commander config" },
	# { on = [ "g", "n" ], run = "cd 'E:/Cache/ChromeDownload'", desc = "Chrome Download" },
	# { on = [ "g", "1" ], run = "cd 'F:/NPU/mxl_nputhesis'", desc = "NPU thesis" },

	# { on = [ "g", "x" ], run = "cd 'F:/西安航空学院'", desc = "西航" },
	# { on = [ "g", "G" ], run = "cd 'E:/Github/My_plugins'", desc = "Github plugin" },
	# Help
	{ on = "<F1>", run = "help", desc = "Open help" },
]

[tasks]

keymap = [
	{ on = "<Esc>", run = "close", desc = "Hide the task manager" },
	{ on = "<C-q>", run = "close", desc = "Hide the task manager" },
	{ on = "w",     run = "close", desc = "Hide the task manager" },

	{ on = "k", run = "arrow -1", desc = "Move cursor up" },
	{ on = "j", run = "arrow 1",  desc = "Move cursor down" },

	{ on = "<Up>",   run = "arrow -1", desc = "Move cursor up" },
	{ on = "<Down>", run = "arrow 1",  desc = "Move cursor down" },

	{ on = "<Enter>", run = "inspect", desc = "Inspect the task" },
	{ on = "x",       run = "cancel",  desc = "Cancel the task" },

	{ on = "<F1>", run = "help", desc = "Open help" }
]

[pick]

keymap = [
	{ on = "<Esc>",   run = "close",          desc = "Cancel pick" },
	{ on = "<C-q>",   run = "close",          desc = "Cancel pick" },
	{ on = "<Enter>", run = "close --submit", desc = "Submit the pick" },

	{ on = "k", run = "arrow -1", desc = "Move cursor up" },
	{ on = "j", run = "arrow 1",  desc = "Move cursor down" },

	{ on = "K", run = "arrow -5", desc = "Move cursor up 5 lines" },
	{ on = "J", run = "arrow 5",  desc = "Move cursor down 5 lines" },

	{ on = "<Up>",   run = "arrow -1", desc = "Move cursor up" },
	{ on = "<Down>", run = "arrow 1",  desc = "Move cursor down" },

	{ on = "<S-Up>",   run = "arrow -5", desc = "Move cursor up 5 lines" },
	{ on = "<S-Down>", run = "arrow 5",  desc = "Move cursor down 5 lines" },

	{ on = "<F1>", run = "help", desc = "Open help" }
]

[input]

keymap = [
	{ on = "<C-q>",   run = "close",          desc = "Cancel input" },
	{ on = "<Enter>", run = "close --submit", desc = "Submit the input" },
	{ on = "<Esc>",   run = "escape",         desc = "Go back the normal mode, or cancel input" },

	# Mode
	{ on = "i", run = "insert",                              desc = "Enter insert mode" },
	{ on = "a", run = "insert --append",                     desc = "Enter append mode" },
	{ on = "I", run = [ "move -999", "insert" ],             desc = "Move to the BOL, and enter insert mode" },
	{ on = "A", run = [ "move 999", "insert --append" ],     desc = "Move to the EOL, and enter append mode" },
	{ on = "v", run = "visual",                              desc = "Enter visual mode" },
	{ on = "V", run = [ "move -999", "visual", "move 999" ], desc = "Enter visual mode and select all" },

	# Character-wise movement
	{ on = "h",       run = "move -1", desc = "Move back a character" },
	{ on = "l",       run = "move 1",  desc = "Move forward a character" },
	{ on = "<Left>",  run = "move -1", desc = "Move back a character" },
	{ on = "<Right>", run = "move 1",  desc = "Move forward a character" },
	{ on = "<C-b>",   run = "move -1", desc = "Move back a character" },
	{ on = "<C-f>",   run = "move 1",  desc = "Move forward a character" },

	# Word-wise movement
	{ on = "b",     run = "backward",              desc = "Move back to the start of the current or previous word" },
	{ on = "w",     run = "forward",               desc = "Move forward to the start of the next word" },
	{ on = "e",     run = "forward --end-of-word", desc = "Move forward to the end of the current or next word" },
	{ on = "<A-b>", run = "backward",              desc = "Move back to the start of the current or previous word" },
	{ on = "<A-f>", run = "forward --end-of-word", desc = "Move forward to the end of the current or next word" },

	# Line-wise movement
	{ on = "0",      run = "move -999", desc = "Move to the BOL" },
	{ on = "$",      run = "move 999",  desc = "Move to the EOL" },
	{ on = "<C-a>",  run = "move -999", desc = "Move to the BOL" },
	{ on = "<C-e>",  run = "move 999",  desc = "Move to the EOL" },
	{ on = "<Home>", run = "move -999", desc = "Move to the BOL" },
	{ on = "<End>",  run = "move 999",  desc = "Move to the EOL" },

	# Delete
	{ on = "<Backspace>", run = "backspace",	        desc = "Delete the character before the cursor" },
	{ on = "<Delete>",    run = "backspace --under", desc = "Delete the character under the cursor" },
	# { on = "<C-h>",       run = "backspace",         desc = "Delete the character before the cursor" },
	# { on = "<C-d>",       run = "backspace --under", desc = "Delete the character under the cursor" },

	# Kill
	{ on = "<C-u>", run = "kill bol",      desc = "Kill backwards to the BOL" },
	{ on = "<C-k>", run = "kill eol",      desc = "Kill forwards to the EOL" },
	{ on = "<C-w>", run = "kill backward", desc = "Kill backwards to the start of the current word" },
	{ on = "<A-d>", run = "kill forward",  desc = "Kill forwards to the end of the current word" },

	# Cut/Yank/Paste
	{ on = "d", run = "delete --cut",                              desc = "Cut the selected characters" },
	{ on = "D", run = [ "delete --cut", "move 999" ],              desc = "Cut until the EOL" },
	{ on = "c", run = "delete --cut --insert",                     desc = "Cut the selected characters, and enter insert mode" },
	{ on = "C", run = [ "delete --cut --insert", "move 999" ],     desc = "Cut until the EOL, and enter insert mode" },
	{ on = "x", run = [ "delete --cut", "move 1 --in-operating" ], desc = "Cut the current character" },
	{ on = "y", run = "yank",           desc = "Copy the selected characters" },
	{ on = "p", run = "paste",          desc = "Paste the copied characters after the cursor" },
	{ on = "P", run = "paste --before", desc = "Paste the copied characters before the cursor" },

	# Undo/Redo
	{ on = "u",     run = "undo", desc = "Undo the last operation" },
	# { on = "<C-r>", run = "redo", desc = "Redo the last operation" },

	# Help
	{ on =  "<F1>" , run = "help", desc = "Open help" }
]

[confirm]

keymap = [
	{ on = "<Esc>",   run = "close",          desc = "Cancel the confirm" },
	{ on = "<Enter>", run = "close --submit", desc = "Submit the confirm" },

	{ on = "n", run = "close",          desc = "Cancel the confirm" },
	{ on = "y", run = "close --submit", desc = "Submit the confirm" },

	{ on = "k", run = "arrow -1", desc = "Move cursor up" },
	{ on = "j", run = "arrow 1",  desc = "Move cursor down" },

	{ on = "<Up>",   run = "arrow -1", desc = "Move cursor up" },
	{ on = "<Down>", run = "arrow 1",  desc = "Move cursor down" },

	# Help
	{ on = "~",    run = "help", desc = "Open help" },
	{ on = "<F1>", run = "help", desc = "Open help" },
]

[cmp]

keymap = [
	{ on = "<C-q>",   run = "close",                                      desc = "Cancel completion" },
	{ on = "<Tab>",   run = "close --submit",                             desc = "Submit the completion" },
	{ on = "<Enter>", run = [ "close --submit", "input:close --submit" ], desc = "Submit the completion and input" },

	{ on = "<A-k>", run = "arrow -1", desc = "Move cursor up" },
	{ on = "<A-j>", run = "arrow 1",  desc = "Move cursor down" },

	{ on = "<Up>",   run = "arrow -1", desc = "Move cursor up" },
	{ on = "<Down>", run = "arrow 1",  desc = "Move cursor down" },

	# { on = "<C-p>", run = "arrow -1", desc = "Move cursor up" },
	# { on = "<C-n>", run = "arrow 1",  desc = "Move cursor down" },

	{ on = "<F1>", run = "help", desc = "Open help" }
]

[help]

keymap = [
	{ on = "<Esc>", run = "escape", desc = "Clear the filter, or hide the help" },
	{ on = "q",     run = "close",  desc = "Exit the process" },
	{ on = "<C-q>", run = "close",  desc = "Hide the help" },

	# Navigation
	{ on = "k", run = "arrow -1", desc = "Move cursor up" },
	{ on = "j", run = "arrow 1",  desc = "Move cursor down" },

	{ on = "K", run = "arrow -5", desc = "Move cursor up 5 lines" },
	{ on = "J", run = "arrow 5",  desc = "Move cursor down 5 lines" },

	{ on = "<Up>",   run = "arrow -1", desc = "Move cursor up" },
	{ on = "<Down>", run = "arrow 1",  desc = "Move cursor down" },

	{ on = "<S-Up>",   run = "arrow -5", desc = "Move cursor up 5 lines" },
	{ on = "<S-Down>", run = "arrow 5",  desc = "Move cursor down 5 lines" },

	# Filtering
	{ on = "/", run = "filter", desc = "Apply a filter for the help items" },
]

## Plugin keymaps
# ouch.yazi
[[mgr.prepend_keymap]]
on = ["c", "a"]
run = "plugin ouch"
desc = "Compress with ouch"

# smart-enter.yazi
[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

# toggle-pane.yazi
[[mgr.prepend_keymap]]
on   = "T"
# run  = "plugin toggle-pane min-preview"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore the preview pane"

# bookmarks.yazi
[[mgr.prepend_keymap]]
on = [ "u", "a" ]
run = "plugin bookmarks 'save'"
desc = "Save current position as a bookmark"

[[mgr.prepend_keymap]]
on = [ "u", "g" ]
run = "plugin bookmarks 'jump'"
desc = "Jump to a bookmark"

[[mgr.prepend_keymap]]
on = [ "u", "d" ]
run = "plugin bookmarks 'delete'"
desc = "Delete a bookmark"

[[mgr.prepend_keymap]]
on = [ "u", "D" ]
run = "plugin bookmarks 'delete_all'"
desc = "Delete all bookmarks"

[[mgr.prepend_keymap]]
on   = [ "i" ]
run = "plugin searchjump"
desc = "searchjump mode"

# clipboard.yazi
[[mgr.prepend_keymap]]
on   = [ "<C-y>" ]
run = "plugin clipboard"

# selected-diff.yazi
[[mgr.prepend_keymap]]
on   = "="
run  = "plugin selected-diff"
desc = "Compare two selected files with Neovim"
